<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visiting Cards Gallery | Asomi Enterprise</title>

    <style>
        body {
            margin: 0;
            padding: 35px 20px 60px;
            font-family: Arial, sans-serif;
            color: white;
            background: linear-gradient(135deg, #07152f, #152b55, #4a2331);
        }

        .container {
            max-width: 1150px;
            margin: auto;
        }

        .back {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 25px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
        }

        h1, .subtitle {
            text-align: center;
        }

        h1 {
            margin-top: 35px;
            font-size: 42px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
            margin-top: 35px;
        }

        .photo-card {
            overflow: hidden;
            border: 2px solid #00c6ff;
            border-radius: 18px;
            background: #172744;
        }

        .photo-card img {
            display: block;
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .photo-card p {
            margin: 0;
            padding: 14px;
            text-align: center;
            font-weight: bold;
            background: linear-gradient(90deg, #00a8e8, #7b2cbf);
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="back" href="../../index.html#services">← Back to Home</a>

        <h1>Visiting Cards Gallery</h1>
        <p class="subtitle">Professional visiting cards with premium finishing.</p>

        <div class="gallery">
            <div class="photo-card">
                <img src="1.jpg" alt="Visiting card design 1">
                <p>Premium Visiting Card</p>
            </div>

            <div class="photo-card">
                <img src="2.jpg" alt="Visiting card design 2">
                <p>Professional Design</p>
            </div>

            <div class="photo-card">
                <img src="3.jpg" alt="Visiting card design 3">
                <p>Quality Finish</p>
            </div>
        </div>
    </div>
</body>
</html>
