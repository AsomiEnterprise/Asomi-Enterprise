<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Printing Gallery | Asomi Enterprise</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 35px 20px 60px;
            font-family: Arial, sans-serif;
            color: white;
            background: linear-gradient(135deg, #07152f, #152b55, #4a2331);
        }

        .container {
            max-width: 1150px;
            margin: auto;
        }

        .back {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 25px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
        }

        h1 {
            margin: 35px 0 10px;
            text-align: center;
            font-size: 42px;
        }

        .subtitle {
            margin-bottom: 35px;
            color: #d6e4ff;
            text-align: center;
            font-size: 18px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
        }

        .photo-card {
            overflow: hidden;
            border: 2px solid rgba(0, 210, 255, 0.45);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .photo-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 18px 35px rgba(0, 200, 255, 0.35);
        }

        .photo-card img {
            display: block;
            width: 100%;
            height: 245px;
            object-fit: cover;
        }

        .photo-card p {
            margin: 0;
            padding: 14px;
            color: white;
            text-align: center;
            font-weight: bold;
            background: linear-gradient(90deg, #00a8e8, #7b2cbf);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            .photo-card img {
                height: 220px;
            }
        }
        .photo-card img {
    transition: transform 0.35s ease;
}

.photo-card:hover img {
    transform: scale(1.08);
}
    </style>
</head>
<body>
    <div class="container">
        <a class="back" href="../../index.html#services">← Back to Home</a>

        <h1>Digital Printing Gallery</h1>
        <p class="subtitle">Quality printing with colour, clarity and creativity.</p>

        <div class="gallery">
            <div class="photo-card"><img src="1.jpg" alt="Digital printing work 1"><p>Premium Print Work</p></div>
            <div class="photo-card"><img src="4.jpg" alt="Digital printing work 4"><p>Creative Design</p></div>
            <div class="photo-card"><img src="5.jpg" alt="Digital printing work 5"><p>Sharp Print Quality</p></div>
            <div class="photo-card"><img src="6.jpg" alt="Digital printing work 6"><p>Reliable Printing</p></div>
        </div>
    </div>
</body>
</html>
