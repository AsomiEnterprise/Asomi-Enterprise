<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex & Banner Gallery | Asomi Enterprise</title>
    <style>
        body {
            margin: 0;
            padding: 35px 20px 60px;
            font-family: Arial, sans-serif;
            color: white;
            background: linear-gradient(135deg, #07152f, #152b55, #4a2331);
        }

        .container {
            max-width: 1150px;
            margin: auto;
        }

        .back {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 25px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
        }

        h1, .subtitle {
            text-align: center;
        }

        h1 {
            margin-top: 35px;
            font-size: 42px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
            margin-top: 35px;
        }

        .photo-card {
            overflow: hidden;
            border: 2px solid #00c6ff;
            border-radius: 18px;
            background: #172744;
        }

        .photo-card img {
            display: block;
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .photo-card p {
            margin: 0;
            padding: 14px;
            text-align: center;
            font-weight: bold;
            background: linear-gradient(90deg, #00a8e8, #7b2cbf);
        }
        .photo-card {
    transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
}

.photo-card:hover {
    transform: translateY(-10px);
    border-color: #8b5cf6;
    box-shadow: 0 18px 35px rgba(0, 200, 255, 0.4);
}

.photo-card img {
    transition: transform 0.35s ease;
}

.photo-card:hover img {
    transform: scale(1.08);
}
    </style>
</head>
<body>
    <div class="container">
        <a class="back" href="../../index.html#services">← Back to Home</a>

        <h1>Flex & Banner Gallery</h1>
        <p class="subtitle">High-quality banners and flex printing.</p>

        <div class="gallery">
            <div class="photo-card">
                <img src="1.jpg" alt="Flex printing work">
                <p>Flex Printing</p>
            </div>

            <div class="photo-card">
                <img src="2.jpg" alt="Banner printing work">
                <p>Banner Printing</p>
            </div>
        </div>
    </div>
</body>
</html>
